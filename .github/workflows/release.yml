# Builds the Windows installer (Setup.exe) and the Linux .deb, plus portable archives of both, and publishes
# them as a GitHub Release.
# Usage: git tag v1.12.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, windows-latest]   # the oldest Ubuntu keeps the binary working on older distros
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System libraries (bundled into the Linux binary)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
          libxcb-shape0 libxcb-xinerama0 vlc
      - name: VLC (bundled into the Windows executable)
        if: runner.os == 'Windows'
        run: choco install vlc -y --no-progress
      - run: pip install -r requirements.txt "pyinstaller>=6.9"
      - run: pyinstaller --noconfirm cinelocal.spec
      - name: Check the built-in player of the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          test -f dist/CineLocal/_internal/libvlc.so.5 && test -d dist/CineLocal/_internal/vlc/plugins
          dist/CineLocal/CineLocal --check-player player-check.txt || { cat player-check.txt; exit 1; }
      - name: Check the built-in player of the packaged app (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not ((Test-Path dist\CineLocal\_internal\libvlc.dll) -and (Test-Path dist\CineLocal\_internal\vlc\plugins))) { throw "libVLC is not in the build" }
          $p = Start-Process dist\CineLocal\CineLocal.exe -ArgumentList '--check-player','player-check.txt' -Wait -PassThru
          if (Test-Path player-check.txt) { Get-Content player-check.txt }
          if ($p.ExitCode -ne 0) { throw "the built-in player failed to load in the packaged app" }
      - name: Linux packages (.deb and portable archive)
        if: runner.os == 'Linux'
        run: |
          bash packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
          tar -czf dist/CineLocal-linux-x86_64-portable.tar.gz -C dist CineLocal
      - name: Windows installer (Inno Setup) and portable archive
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" installer\cinelocal.iss
          Compress-Archive -Path dist\CineLocal -DestinationPath dist\CineLocal-windows-x86_64-portable.zip
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}
          path: dist/CineLocal-*

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
